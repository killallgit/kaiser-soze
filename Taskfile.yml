version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  check:
    desc: Run the formatting check, clippy with warnings as errors, and all tests
    cmds:
      - scripts/check.sh

  test:unit:
    desc: Run only the unit tests; pass a module filter after -- (for example sse::)
    cmds:
      - cargo test --lib {{.CLI_ARGS}}

  test:integration:
    desc: Run only the integration tests in tests/
    cmds:
      - cargo test --test proxy

  test:wrappers:
    desc: Run the shell tests for the agent wrappers and their installer
    cmds:
      - tests/wrappers/run.sh

  wrappers:install:
    desc: Install the claude, codex and agent wrappers for zsh or bash; pass --dry-run after --
    cmds:
      - scripts/wrappers.sh install {{.CLI_ARGS}}

  wrappers:uninstall:
    desc: Remove the wrappers and their start-up file block; pass --dry-run after --
    cmds:
      - scripts/wrappers.sh uninstall {{.CLI_ARGS}}

  dev:
    desc: Run the shared proxy until stopped; pass -- --stream for real-time metadata
    cmds:
      - scripts/dev.sh {{.CLI_ARGS}}

  dev:stream:
    desc: Run the shared proxy with compact real-time terminal metadata
    cmds:
      - scripts/dev.sh --stream --log-format human {{.CLI_ARGS}}

  dev:stream:json:
    desc: Run the shared proxy with real-time metadata as JSON logs
    cmds:
      - scripts/dev.sh --stream --log-format json {{.CLI_ARGS}}

  service:install:
    desc: Build the debug binary, install it as the always-on macOS service on port 48731, and restart it
    vars:
      BINARY:
        sh: cargo metadata --format-version 1 --no-deps | jq -r '.target_directory + "/debug/soze"'
    cmds:
      - cargo build --quiet
      - scripts/service.sh install "{{.BINARY}}"

  service:restart:
    desc: Restart the service abruptly; in-flight streams are cut
    cmds:
      - scripts/service.sh restart

  service:reload:
    desc: Reload the service's live logging settings from config.toml
    cmds:
      - scripts/service.sh reload

  service:logs:
    desc: Follow soze.log, the service's stderr; never the tap
    cmds:
      - scripts/service.sh logs

  service:status:
    desc: Show the service state, pid and what is installed
    cmds:
      - scripts/service.sh status

  service:uninstall:
    desc: Remove the service and binary, keeping captures, logs and config; pass --purge after -- to delete the data dir
    cmds:
      - scripts/service.sh uninstall {{.CLI_ARGS}}
