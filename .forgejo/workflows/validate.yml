name: Kaiser Soze checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: rust
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: timeout 300 scripts/check.sh
